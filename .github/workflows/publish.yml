# Builds the index, the pictures and the website, and publishes them to
# GitHub Pages — which is where the app reads the library from. Runs on every
# merge.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the entries' added/updated dates and versions come from git history
      # The engine is AutomataStudio's library tools as one bundle, which its CI
      # tests against the source and pushes to this repository's `engine`
      # branch. AutomataStudio's own repository is private, so it is not
      # checked out, and the bundle needs no install.
      - name: Check out the engine
        uses: actions/checkout@v4
        with:
          repository: thethinkmachine/automata-library
          ref: engine
          path: .engine
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build
        run: >
          node .engine/build.mjs
          --library . --out _site --commit "${{ github.sha }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
